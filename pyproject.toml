[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "yt-to-site"
version = "0.1.0"
description = "Turn any YouTube channel into a multi-language content website"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.0",
    "cohere>=5.0",
    "numpy>=1.24",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
yts = "yt_to_site.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
